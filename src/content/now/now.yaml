# The Now strip on the home page: one line naming what is in hand right now.
#
# THIS FILE IS MEANT TO BE EDITED OFTEN, AND IT GOES STALE BY DESIGN. It is here,
# rather than in src/pages/index.astro, so that changing what the site says Ryan
# is doing this month is a content commit and not a code change. Edit this file
# and nothing else.
#
# Two rules this copy is held to. No employer is named: the home page is a
# positioning surface, and the résumé names the employer in `work` so that
# surfaces like this one do not have to. And it is prose like any other on this
# site, so it is subject to the `house-style` skill -- no em dashes, no
# contractions, American spelling:
#
#   node .claude/skills/house-style/scripts/check-prose.mjs <a file holding these lines>
#
# One clause per item, sentence-cased. The template joins them with a middot, so
# no item carries the separator itself.
#
# A markdown link, `[text](/path)`, is the one markup an item may carry. The home
# page renders it as a link and /index.md prints it as written
# (src/lib/now-links.ts).
items:
  - Tuning the evals that grade this site's agents
  - Showing how to connect an MCP client to this site at [/connect](/connect)
  - Shipping armature, a Claude Code plugin that works an epic end to end
