version: 2

# `commit-message.prefix` is load-bearing, not cosmetic. PRs here are squash-merged, so the PR
# title becomes the commit subject release-please parses on `main`, and Dependabot writes that
# title. Left to its own devices Dependabot infers `build(deps):` from the repo's history, which
# release-please reads as type `build` — see `deps` / `deps-dev` in release-please-config.json's
# changelog-sections for where these land instead.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: America/Los_Angeles
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # agents declares exact peers on @modelcontextprotocol/client, /server and /sdk (0.24.0
      # pins 2.0.0, 2.0.0 and 1.30.0), and the MCP SDK ships ahead of it. Inside `all`, an
      # MCP release that agents has not caught up to fails `npm ci` with ERESOLVE and holds
      # back every other update in the PR (#452). Dependabot puts a dependency in the first
      # group it matches, so this group has to come before `all`; its PR can sit red until
      # agents moves its pins without blocking anything else.
      mcp-stack:
        patterns: ['agents', '@modelcontextprotocol/*']
      # Majors match no group, so each one arrives as its own PR. Every hand intervention
      # on a grouped PR before this split was one package the rest could not move with:
      # TypeScript 7 against @astrojs/check's peer range (#4), prettier-plugin-astro 1.0
      # reformatting 24 files (#163), and the MCP SDK against agents' pins (#452). A major
      # that fails now fails alone, and can wait or be worked on its own branch.
      minor-and-patch:
        patterns: ['*']
        exclude-patterns: ['agents', '@modelcontextprotocol/*']
        update-types: ['minor', 'patch']
    ignore:
      # @astrojs/check declares peer typescript '^5.0.0 || ^6.0.0', so a major bump
      # fails `npm ci` with ERESOLVE before any check runs. Since majors stopped being
      # grouped, that PR would fail on its own rather than block every npm update, and
      # this entry now only keeps a PR that cannot pass from being opened each week.
      # Drop it once @astrojs/check supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: America/Los_Angeles
    # No `prefix-development`: the github-actions ecosystem has no dev/prod split, so every
    # action bump is a plain dependency.
    commit-message:
      prefix: deps
  # workers/mcp carries its own manifest so Workers Builds can use it as a root
  # directory. Its dependency pins are duplicated from the root package.json and
  # will drift without their own update schedule.
  - package-ecosystem: npm
    directory: /workers/mcp
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: America/Los_Angeles
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # Same groups as the root entry, for the same reasons.
      mcp-stack:
        patterns: ['agents', '@modelcontextprotocol/*']
      minor-and-patch:
        patterns: ['*']
        exclude-patterns: ['agents', '@modelcontextprotocol/*']
        update-types: ['minor', 'patch']
