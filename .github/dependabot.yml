version: 2

# `commit-message.prefix` is load-bearing, not cosmetic. PRs here are squash-merged, so the PR
# title becomes the commit subject release-please parses on `main`, and Dependabot writes that
# title. Left to its own devices Dependabot infers `build(deps):` from the repo's history, which
# release-please reads as type `build` — see `deps` / `deps-dev` in release-please-config.json's
# changelog-sections for where these land instead.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: America/Los_Angeles
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      all:
        patterns: ['*']
    ignore:
      # @astrojs/check declares peer typescript '^5.0.0 || ^6.0.0', so a major bump
      # fails `npm ci` with ERESOLVE before any check runs. Because every npm update
      # is grouped into one PR above, leaving this unignored blocks *all* npm updates,
      # not just this one. Drop this entry once @astrojs/check supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: America/Los_Angeles
    # No `prefix-development`: the github-actions ecosystem has no dev/prod split, so every
    # action bump is a plain dependency.
    commit-message:
      prefix: deps
  # workers/mcp carries its own manifest so Workers Builds can use it as a root
  # directory. Its dependency pins are duplicated from the root package.json and
  # will drift without their own update schedule.
  - package-ecosystem: npm
    directory: /workers/mcp
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: America/Los_Angeles
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      all:
        patterns: ['*']
