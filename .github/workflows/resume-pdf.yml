name: resume-pdf

# Publishes the résumé sheet to R2 when the résumé content changes (issue #185,
# epic #180).
#
# NO `paths:` FILTER, DELIBERATELY. A filter listing the YAML and the route is
# exactly how a stylesheet change silently fails to republish. The hash gate in
# the `plan` step is the correctness mechanism instead: it computes the content
# hash and asks R2 whether both keys are already there. Running this job to
# discover the sheet has not changed costs two requests and about twenty
# seconds, because everything expensive below is gated on that answer.
#
# Two rather than one because the Worker still writes the content-addressed key
# at runtime until issue 06 lands, so that key alone does not answer whether
# this workflow has ever published. publishDecision() in
# scripts/resume-publish.mjs carries the full reasoning.
#
# THIS IS THE ONLY WORKFLOW IN THE REPOSITORY THAT HOLDS A CLOUDFLARE
# CREDENTIAL, and CLAUDE.md records why it is scoped the way it is. Since #205
# that credential is an S3 pair restricted to `ryanlindsey-me-assets`, which is
# what keeps CI unable to reach `ryanlindsey-me-private`.

on:
  push:
    branches: [main]
  # The acceptance path, and the repair path: a run that uploaded the alias and
  # then failed leaves the content-addressed key absent, so a dispatch
  # re-publishes both.
  workflow_dispatch:
    inputs:
      force:
        description: 'Republish both keys even when the bucket already holds them'
        type: boolean
        default: false

permissions:
  contents: read

# Not cancel-in-progress. Two runs racing write identical bytes to identical
# keys, so the race is harmless, but cancelling one mid-upload is how a run ends
# between the two writes.
concurrency:
  group: resume-pdf

jobs:
  # TEMPORARY -- REMOVE BEFORE MERGE. Proves the S3 credentials, the endpoint
  # and the argument shape before any of this reaches main, because the flags
  # could not be validated locally and four runs have already been spent
  # discovering credential problems in production.
  #
  # UNGUARDED, SO IT RUNS FROM A BRANCH, and therefore READ-ONLY: one
  # head-object and nothing else. The publish job below is guarded to main so a
  # branch dispatch cannot put a branch's resume into the bucket; this job holds
  # no write of any kind, so that guard has nothing to protect here.
  #
  # A 404 IS A PASS. resume/latest.pdf does not exist yet, so
  # `An error occurred (404) ... HeadObject` means the request was signed,
  # accepted and answered -- which is the whole question. A 401, 403,
  # SignatureDoesNotMatch or InvalidAccessKeyId means the credentials or the
  # endpoint are wrong.
  verify-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Head the alias key
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RLME_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RLME_R2_SECRET_ACCESS_KEY }}
        run: |
          aws --version
          node -e "
            const { objectHeadArguments } = await import('./scripts/resume-publish.mjs');
            console.log(objectHeadArguments('resume/latest.pdf').join(' '));
          " --input-type=module
          set +e
          OUT=$(AWS_DEFAULT_REGION=auto aws s3api head-object \
            --bucket ryanlindsey-me-assets \
            --key resume/latest.pdf \
            --endpoint-url https://1b764d090899bf1ee61a8d1e87c10710.r2.cloudflarestorage.com 2>&1)
          echo "$OUT"
          echo "$OUT" | grep -q 'An error occurred (404) when calling the HeadObject operation' \
            && { echo "PASS: signed, accepted, object simply absent"; exit 0; }
          echo "$OUT" | grep -q '^{' && { echo "PASS: object exists and was read"; exit 0; }
          echo "FAIL: not an authenticated answer"; exit 1

  publish:
    # A dispatch can name any ref, and this job renders that ref's résumé and
    # puts it straight into the production bucket. Restricting the job rather
    # than the publish step means a dispatch from a branch reads as skipped in
    # the Actions UI instead of running green having published nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 1, unlike checks.yml. The résumé gate's `contract` check
      # diffs against a merge base and needs full history; it reports `skip`
      # outside a pull request, which is what this is, so there is nothing here
      # for a deep clone to buy.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # TWO REQUESTS, AND THEY DECIDE THE REST OF THE JOB. Reads the résumé YAML,
      # hashes it with the same code the Worker uses, and asks R2 for that key.
      #
      # THE CREDENTIALS ARE SET ON THE TWO STEPS THAT TALK TO R2, NOT ON THE
      # JOB. `npm run build` below is `astro build`, and CLAUDE.md records that
      # an `ai` binding in the site's config would make it open a remote proxy
      # session that credential-free CI cannot authenticate. That reasoning is
      # about a binding this Worker does not have, but a build running with
      # storage credentials in its environment is a different build from the one
      # checks.yml runs, and there is no reason to find out how different.
      #
      # AN S3 PAIR RATHER THAN A BEARER TOKEN, and that is a correction (#205).
      # `CLOUDFLARE_API_TOKEN: secrets.RLME_R2_STORAGE` sat here and every run
      # failed: an R2 API token is an S3 credential, not a Cloudflare API token,
      # so `wrangler r2 object` could not authenticate with it. The script's
      # header carries the measurement. The account id stays public and lives in
      # scripts/resume-publish.mjs, where it is now the endpoint's hostname.
      - name: Plan
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RLME_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RLME_R2_SECRET_ACCESS_KEY }}
          RESUME_PUBLISH_FORCE: ${{ inputs.force }}
        run: node scripts/resume-publish.mjs plan

      # EVERY STEP BELOW IS GATED ON ONE STRING, so a plan that exits 0 without
      # emitting it would skip the whole job and report success. That is the
      # frozen file this epic exists to fix, wearing a green check. The script
      # guards its own entry point carefully for the same reason; this is the
      # assertion that the guard worked.
      - name: Assert the plan answered
        if: steps.plan.outputs.publish != 'true' && steps.plan.outputs.publish != 'false'
        run: |
          echo "The plan step emitted no publish output. Nothing was checked and nothing would be published."
          exit 1

      - name: Build
        if: steps.plan.outputs.publish == 'true'
        run: npm run build

      # Chrome is preinstalled on the runner image and scripts/resume-sheet.mjs
      # finds it at /usr/bin/google-chrome-stable. `npm run resume:pdf` would
      # build a second time; the step above already wrote dist/client, which is
      # what the renderer serves.
      - name: Render the sheet
        if: steps.plan.outputs.publish == 'true'
        run: node scripts/resume-sheet.mjs

      # pdffonts and pdfinfo answer for the gate's `fonts` and `tagged` checks.
      - name: Install poppler
        if: steps.plan.outputs.publish == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      # THE GATE RUNS BEFORE THE UPLOAD, NOT ONLY IN checks.yml. Both workflows
      # trigger on a push to main and neither waits for the other, so without
      # this step there is a path from a commit to a live PDF that no assertion
      # stands in -- which is the hole the whole epic exists to close. It costs
      # seconds on the few runs a year that get past the hash gate.
      - name: Gate the sheet
        if: steps.plan.outputs.publish == 'true'
        run: npm run resume:gate

      - name: Publish to R2
        if: steps.plan.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RLME_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RLME_R2_SECRET_ACCESS_KEY }}
        run: node scripts/resume-publish.mjs publish
